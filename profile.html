<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Litterbox</title>
<meta name="description" content="Mod creator profiles on Litterbox - Cat Goes Fishing mods.">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="Litterbox">
<meta property="og:title" content="Litterbox - Cat Goes Fishing mods">
<meta property="og:description" content="Mod creator profiles on Litterbox - Cat Goes Fishing mods.">
<meta property="og:image" content="https://litterbox.fyi/assets/og-image.png">
<meta property="og:url" content="https://litterbox.fyi/profile.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Litterbox - Cat Goes Fishing mods">
<meta name="twitter:description" content="Mod creator profiles on Litterbox - Cat Goes Fishing mods.">
<meta name="twitter:image" content="https://litterbox.fyi/assets/og-image.png">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/app.js"></script>
<style>
.mini-mod-list { display: flex; flex-direction: column; gap: 10px; }
.mini-mod-row {
  display: flex; align-items: center; gap: 14px; padding: 12px 14px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); text-decoration: none; color: inherit;
  transition: border-color .12s ease, background .12s ease, transform .12s ease, box-shadow .12s ease;
  animation: lb-card-in .28s var(--ease-out) both;
}
@media (hover: hover) and (pointer: fine) {
  .mini-mod-row:hover {
    border-color: var(--color-border-strong); background: var(--color-surface-hover);
    transform: translateY(-1px); box-shadow: var(--shadow-hover);
  }
}
.mini-mod-row:nth-child(1) { animation-delay: 0ms; }
.mini-mod-row:nth-child(2) { animation-delay: 25ms; }
.mini-mod-row:nth-child(3) { animation-delay: 50ms; }
.mini-mod-row:nth-child(n+4) { animation-delay: 70ms; }
.mini-mod-icon {
  width: 44px; height: 44px; border-radius: var(--radius-sm); background: var(--color-accent-tint);
  display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
  font-family: var(--font-mono); font-weight: 700; font-size: 12px; color: var(--color-accent);
}
.mini-mod-icon img { width: 100%; height: 100%; object-fit: cover; }
.mini-mod-name { font-weight: 600; font-size: 14px; margin: 0; }
.mini-mod-stats { margin-left: auto; display: flex; gap: 10px; flex-shrink: 0; }
.credited-role { font-size: 12px; color: var(--color-text-faint); margin: 2px 0 0; }

.edit-toggle-link { font-size: 13px; font-weight: 600; }
.avatar-file-input { max-width: 260px; }
.avatar-edit-row { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.avatar-edit-preview { width: 64px; height: 64px; font-size: 18px; border-width: 2px; flex-shrink: 0; }
.avatar-field { flex: 1; margin-bottom: 0; }
.profile-section .card { max-width: 460px; }

.profile-banner {
  height: 160px; background: var(--color-accent-ink); position: relative; overflow: hidden;
  background-size: cover; background-position: center;
}
.profile-banner:empty { display: none; }
.profile-banner::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(6,10,9,.55) 100%);
}
.role-tag-pill {
  display: inline-flex; align-items: center; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
  color: var(--color-accent); background: var(--color-accent-tint); border: 1px solid var(--color-accent);
  border-radius: var(--radius-pill); padding: 3px 10px; margin: 4px 0 0;
}
.social-links-row { display: flex; gap: 8px; margin-top: 10px; }
.social-link-btn {
  width: 32px; height: 32px; border-radius: 50%; background: var(--color-surface); border: 1px solid var(--color-border);
  color: var(--color-text-muted); display: flex; align-items: center; justify-content: center; font-size: 14px;
  text-decoration: none; transition: color .12s ease, border-color .12s ease;
}
.social-link-btn:hover { color: var(--color-accent); border-color: var(--color-accent); }

@media (max-width: 480px) {
  .profile-head { padding: 20px 16px 4px; }
  .profile-avatar { width: 72px; height: 72px; font-size: 20px; }
  .profile-info h1 { font-size: 20px; }
  .profile-banner { height: 110px; }
}
</style>
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">
    <img src="assets/logo.png" alt="" class="brand-mark">
    <span class="brand-name">Litterbox</span>
  </a>
  <div class="header-right">
    <span id="notifSlot"></span>
    <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
    <div class="nav-drawer" id="navDrawer"></div>
  </div>
</header>

<div id="gate" class="gate-state">Loading profile…</div>

<div id="pageWrap" class="page-reveal" style="display:none;">
  <div class="profile-banner" id="profileBanner"></div>
  <div class="profile-head">
    <div class="profile-avatar" id="avatarEl"></div>
    <div class="profile-info">
      <h1 id="usernameEl"></h1>
      <span class="role-tag-pill" id="roleTagEl" style="display:none;"></span>
      <p class="profile-bio" id="bioEl"></p>
      <div id="socialLinksEl"></div>
      <div class="profile-stats-row">
        <span class="stat-chip" id="statMods"></span>
        <span class="stat-chip" id="statDownloads"></span>
        <span class="stat-chip" id="statFavorited"></span>
      </div>
    </div>
    <a class="edit-toggle-link" href="edit-profile.html" id="editToggle" style="display:none;">Edit profile</a>
  </div>

  <div class="profile-section">
    <h2>Badges</h2>
    <div id="badgesEl"></div>
  </div>

  <div class="profile-section">
    <h2>Mods</h2>
    <div id="modsEl" class="mini-mod-list"></div>
  </div>

  <div class="profile-section" id="creditedSection" style="display:none;">
    <h2>Credited in</h2>
    <div id="creditedEl" class="mini-mod-list"></div>
  </div>

  <div class="profile-section">
    <h2>Favorited mods</h2>
    <div id="favoritesEl" class="mini-mod-list"></div>
  </div>
</div>

<footer class="site-footer">Litterbox &middot; made for the Cat Goes Fishing community &middot; <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a></footer>

<script>
const gateEl = document.getElementById("gate");
const pageWrapEl = document.getElementById("pageWrap");

let currentUser = null;
let profileUser = null;

// DOWNLOAD_ICON, VERIFIED_BADGE, CUBE_ICON, HEART_ICON i LB_renderRatingChip są
// już zadeklarowane globalnie w assets/app.js (ładowanym przed tym skryptem) -
// NIE deklaruj ich tu ponownie, bo `const` redeklarowany w tym samym zasięgu
// globalnym to SyntaxError, który wywala CAŁY ten blok <script> (i przez to
// strona wisi na "Loading profile…" - to właśnie był dotychczasowy bug, bo
// CUBE_ICON było zadeklarowane tutaj I w app.js).

function renderMiniMod(mod) {
  const safeIconUrl = isTrustedStorageUrl(mod.icon_url) ? escapeHtml(mod.icon_url) : null;
  return `
    <a class="mini-mod-row" href="mod.html?id=${encodeURIComponent(mod.id)}">
      <div class="mini-mod-icon">${safeIconUrl ? `<img src="${safeIconUrl}" alt="">` : iconInitials(mod.name)}</div>
      <p class="mini-mod-name">${escapeHtml(mod.name)}</p>
      <div class="mini-mod-stats">
        <span class="stat-chip">${DOWNLOAD_ICON}<strong>${LB_formatCount(mod.download_count ?? 0)}</strong></span>
        ${LB_renderRatingChip(mod.rating, mod.rating_count)}
      </div>
    </a>
  `;
}

async function loadAndRenderMods(userId) {
  const { data } = await supabaseClient
    .from("mods")
    .select("*")
    .eq("user_id", userId)
    .order("created_at", { ascending: false });

  const mods = data || [];
  document.getElementById("modsEl").innerHTML = mods.length
    ? mods.map(renderMiniMod).join("")
    : `<p class="empty-inline">No mods uploaded yet.</p>`;

  const totalDownloads = mods.reduce((sum, m) => sum + (m.download_count || 0), 0);
  document.getElementById("statMods").innerHTML = `${CUBE_ICON}<strong>${mods.length}</strong> mod${mods.length === 1 ? "" : "s"}`;
  document.getElementById("statDownloads").innerHTML = `${DOWNLOAD_ICON}<strong>${LB_formatCount(totalDownloads)}</strong> total downloads`;
}

async function loadAndRenderFavorites(userId) {
  const { data } = await supabaseClient
    .from("mod_favorites")
    .select("mod_id, mods(*)")
    .eq("user_id", userId)
    .order("created_at", { ascending: false });

  const favMods = (data || []).map(row => row.mods).filter(Boolean);
  document.getElementById("favoritesEl").innerHTML = favMods.length
    ? favMods.map(renderMiniMod).join("")
    : `<p class="empty-inline">No favorited mods yet.</p>`;
  document.getElementById("statFavorited").innerHTML = `${HEART_ICON}<strong>${favMods.length}</strong> favorited`;
}

async function loadAndRenderCredited(userId) {
  const { data } = await supabaseClient
    .from("mod_credits")
    .select("comment, mods(id, name, icon_url)")
    .eq("credited_user_id", userId);

  const rows = (data || []).filter(r => r.mods);
  document.getElementById("creditedSection").style.display = rows.length ? "block" : "none";
  document.getElementById("creditedEl").innerHTML = rows.map(r => {
    const safeIconUrl = isTrustedStorageUrl(r.mods.icon_url) ? escapeHtml(r.mods.icon_url) : null;
    return `
      <a class="mini-mod-row" href="mod.html?id=${encodeURIComponent(r.mods.id)}">
        <div class="mini-mod-icon">${safeIconUrl ? `<img src="${safeIconUrl}" alt="">` : iconInitials(r.mods.name)}</div>
        <div>
          <p class="mini-mod-name">${escapeHtml(r.mods.name)}</p>
          ${r.comment ? `<p class="credited-role">${escapeHtml(r.comment)}</p>` : ""}
        </div>
      </a>
    `;
  }).join("");
}

async function loadAndRenderBadges(userId) {
  const { data } = await supabaseClient
    .from("user_badges")
    .select("*")
    .eq("user_id", userId)
    .order("earned_at", { ascending: false });
  document.getElementById("badgesEl").innerHTML = LB_renderBadges(data || []);
}

function wireEditToggle() {
  document.getElementById("editToggle").style.display = "inline-block";
}

function renderIdentity() {
  const safeAvatar = isTrustedStorageUrl(profileUser.avatar_url) ? escapeHtml(profileUser.avatar_url) : null;
  document.getElementById("avatarEl").innerHTML = safeAvatar
    ? `<img src="${safeAvatar}" alt="">`
    : iconInitials(profileUser.username);
  document.getElementById("usernameEl").innerHTML = `${escapeHtml(profileUser.username)}${profileUser.is_verified ? VERIFIED_BADGE : ""}`;
  document.getElementById("bioEl").textContent = profileUser.bio || "No bio yet.";

  const safeBanner = isTrustedStorageUrl(profileUser.banner_url) ? escapeHtml(profileUser.banner_url) : null;
  const bannerEl = document.getElementById("profileBanner");
  bannerEl.style.backgroundImage = safeBanner ? `url('${safeBanner}')` : "";

  const roleTagEl = document.getElementById("roleTagEl");
  if (profileUser.role_tag) {
    roleTagEl.textContent = profileUser.role_tag;
    roleTagEl.style.display = "inline-flex";
  } else {
    roleTagEl.style.display = "none";
  }

  document.getElementById("socialLinksEl").innerHTML = LB_renderSocialLinks(profileUser.social_links);
}

async function init() {
  const nav = await LB_mountHeaderNav();
  currentUser = nav.user;

  const username = new URLSearchParams(window.location.search).get("u");
  if (!username) {
    gateEl.textContent = "No user specified.";
    return;
  }

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("username", username)
    .maybeSingle();

  if (error || !data) {
    gateEl.textContent = "That user doesn't exist.";
    return;
  }

  profileUser = data;
  document.title = `${profileUser.username} - Litterbox`;
  LB_setMetaTags({
    title: `${profileUser.username} - Litterbox`,
    description: (profileUser.bio || `${profileUser.username}'s mods on Litterbox.`).slice(0, 200),
    image: isTrustedStorageUrl(profileUser.avatar_url) ? profileUser.avatar_url : "https://litterbox.fyi/assets/og-image.png",
    url: `https://litterbox.fyi/profile.html?u=${encodeURIComponent(profileUser.username)}`
  });
  renderIdentity();

  await Promise.all([
    loadAndRenderMods(profileUser.id),
    loadAndRenderFavorites(profileUser.id),
    loadAndRenderBadges(profileUser.id),
    loadAndRenderCredited(profileUser.id),
  ]);

  if (currentUser && currentUser.id === profileUser.id) {
    try {
      wireEditToggle();
    } catch (err) {
      console.error("wireEditToggle failed:", err);
    }
  }

  gateEl.style.display = "none";
  pageWrapEl.style.display = "block";
  requestAnimationFrame(() => pageWrapEl.classList.add("is-visible"));
}

init();
</script>

</body>
</html>
