<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Litterbox - Mods for Cat Goes Fishing</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Litterbox">

<meta property="og:description" content="Browse and share mods for Cat Goes Fishing.">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Litterbox - Mods for Cat Goes Fishing">
<meta name="twitter:description" content="Browse and share mods for Cat Goes Fishing.">

<style>
/* ---------- browse page layout: sidebar (search + tabs + category filters) + main list ----------
   Page-specific, same convention as the old toolbar/search-orb block this replaces: layout that
   only this page uses lives here, shared component styles live in style.css. */
.browse-layout {
  max-width: 1280px; margin: 0 auto; padding: 28px clamp(16px, 5vw, 56px) 64px;
  display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 28px; align-items: start;
}

.browse-sidebar { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (min-width: 861px) {
  .browse-sidebar { position: sticky; top: calc(var(--header-h) + 20px); }
}

.sidebar-search-row { display: flex; align-items: center; gap: 8px; }
.sidebar-search {
  position: relative; flex: 1; min-width: 0;
}
.sidebar-search i {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--color-text-faint); font-size: 13px; pointer-events: none;
}
.sidebar-search input {
  width: 100%; height: 40px; box-sizing: border-box;
  background: var(--color-btn-secondary-bg); border: 1px solid var(--color-border);
  border-radius: var(--radius-pill); padding: 0 14px 0 38px;
  color: var(--color-text); font-family: var(--font-body); font-size: 14px;
  transition: border-color .12s ease;
}
.sidebar-search input:focus { outline: none; border-color: var(--color-accent); }
.sidebar-search input::placeholder { color: var(--color-text-faint); }

.filters-toggle-btn {
  display: none; flex-shrink: 0; align-items: center; gap: 7px;
  height: 40px; padding: 0 14px; background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-pill); color: var(--color-text-muted);
  font-family: var(--font-body); font-weight: 600; font-size: 13.5px; cursor: pointer;
  transition: color .12s ease, border-color .12s ease;
}
.filters-toggle-btn:hover, .filters-toggle-btn[aria-expanded="true"] { color: var(--color-text); border-color: var(--color-border-strong); }

.sidebar-filters { display: flex; flex-direction: column; gap: 14px; }
.browse-subtabs { margin-top: 0; }

.category-box {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); padding: 16px;
}
.category-box-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.category-box-head h2 {
  margin: 0; font-size: 15.5px; font-weight: var(--weight-heading); letter-spacing: -0.2px;
}
.category-collapse-btn {
  background: none; border: none; color: var(--color-text-faint); cursor: pointer;
  width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm); font-size: 12px; transition: background .12s ease, transform .16s var(--ease-out);
}
.category-collapse-btn:hover { background: var(--color-surface-hover); color: var(--color-text); }
.category-box.collapsed .category-collapse-btn { transform: rotate(180deg); }
.category-box.collapsed .category-list, .category-box.collapsed .category-clear-link { display: none; }

.category-list { display: flex; flex-direction: column; gap: 1px; margin-top: 8px; }
.category-list-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: none; border: none; border-radius: var(--radius-sm);
  padding: 9px 10px; font-family: var(--font-body); font-weight: 600; font-size: 13.5px;
  color: var(--color-text-muted); cursor: pointer; text-align: left;
  transition: background .12s ease, color .12s ease;
}
.category-list-item:hover { background: var(--color-surface-hover); color: var(--color-text); }
.category-list-item i:first-child { width: 15px; text-align: center; font-size: 12.5px; color: var(--color-text-faint); flex-shrink: 0; }
.category-list-item span { flex: 1; min-width: 0; }
.category-list-item .cat-check { opacity: 0; font-size: 11px; flex-shrink: 0; }
.category-list-item.active { background: var(--color-accent-tint); color: var(--color-accent); }
.category-list-item.active i:first-child { color: var(--color-accent); }
.category-list-item.active .cat-check { opacity: 1; }

.category-clear-link {
  display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 0 4px;
  font-family: var(--font-body); font-weight: 600; font-size: 12px;
  color: var(--color-text-faint); background: none; border: none; cursor: pointer; padding: 0;
  transition: color .12s ease;
}
.category-clear-link:hover { color: var(--color-text); }

.browse-main { min-width: 0; }
.browse-main-head {
  display: flex; align-items: center; justify-content: flex-end; gap: 12px;
  margin-bottom: 16px; flex-wrap: wrap;
}
.browse-main-controls { display: flex; align-items: center; gap: 10px; }

/* ---- pigulkowy sort + list/grid toggle, moved here from the old top toolbar ---- */
.pill-select {
  position: relative; display: flex; align-items: center; gap: 6px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-pill); padding: 0 6px 0 14px;
}
.pill-select label { font-size: 13px; color: var(--color-text-muted); white-space: nowrap; margin: 0; font-weight: 500; }
.pill-select select {
  appearance: none; background: none; border: none; color: var(--color-text);
  font-family: var(--font-body); font-weight: 600; font-size: 13px;
  padding: 7px 22px 7px 4px; cursor: pointer;
}
.pill-select select:focus { outline: none; }
.pill-select i {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  font-size: 9px; color: var(--color-text-faint); pointer-events: none;
}
.view-toggle { display: flex; border: 1px solid var(--color-border); border-radius: var(--radius-pill); overflow: hidden; }
.view-btn {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; background: var(--color-surface); border: none; cursor: pointer;
  color: var(--color-text-faint); font-size: 14px;
  transition: color .12s ease, background .12s ease;
}
.view-btn:hover { color: var(--color-text); }
.view-btn.active { background: var(--color-btn-secondary-bg); color: var(--color-text); }
.view-btn + .view-btn { border-left: 1px solid var(--color-border); }

.mods-list { display: flex; flex-direction: column; gap: 10px; }

@media (max-width: 860px) {
  .browse-layout { display: block; padding: 20px 16px 48px; }
  .browse-sidebar { margin-bottom: 18px; }
  .filters-toggle-btn { display: inline-flex; }
  .sidebar-filters {
    display: none; background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-lg); padding: 14px; margin-top: 10px;
  }
  .sidebar-filters.open { display: flex; }
  .category-box { background: none; border: none; padding: 0; }
}
@media (max-width: 480px) {
  .browse-main-head { align-items: flex-start; }
  .browse-main-controls { width: 100%; justify-content: space-between; }
}
</style>
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">
    <img src="assets/logo.png" alt="" class="brand-mark">
    <span class="brand-name">Litterbox</span>
  </a>
  <div class="header-right">
    <span id="notifSlot"></span>
    <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
    <div class="nav-drawer" id="navDrawer"></div>
  </div>
</header>

<main>
  <div class="browse-layout">
    <aside class="browse-sidebar">
      <div class="sidebar-search-row">
        <div class="sidebar-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="search" type="text" placeholder="Search mods..." aria-label="Search mods">
        </div>
        <button type="button" class="filters-toggle-btn" id="filtersToggleBtn" aria-expanded="false" aria-controls="sidebarFilters">
          <i class="fa-solid fa-sliders"></i> Filters
        </button>
      </div>

      <div class="sidebar-filters" id="sidebarFilters">
        <div class="browse-tabs" role="tablist">
          <button type="button" class="browse-tab active" id="modsTabBtn" role="tab"><i class="fa-solid fa-cube"></i> Mods</button>
          <button type="button" class="browse-tab" id="creatorsTabBtn" role="tab"><i class="fa-solid fa-user-group"></i> Creators</button>
        </div>

        <div class="browse-tabs browse-subtabs" role="tablist" id="releaseTabs">
          <button type="button" class="browse-tab active" id="releasedTabBtn" role="tab"><i class="fa-solid fa-circle-check"></i> Out</button>
          <button type="button" class="browse-tab" id="previewTabBtn" role="tab"><i class="fa-solid fa-flask"></i> Previews</button>
        </div>

        <div class="category-box" id="categoryBox" style="display:none;">
          <div class="category-box-head">
            <h2>Category</h2>
            <button type="button" class="category-collapse-btn" id="categoryCollapseBtn" aria-expanded="true" aria-label="Collapse categories">
              <i class="fa-solid fa-chevron-up"></i>
            </button>
          </div>
          <div class="category-list" id="categoryList"></div>
          <button type="button" class="category-clear-link" id="categoryClear" hidden>
            <i class="fa-solid fa-xmark"></i> Clear filters
          </button>
        </div>
      </div>
    </aside>

    <section class="browse-main">
      <div class="browse-main-head">
        <div class="browse-main-controls" id="browseMainControls">
          <div class="pill-select">
            <label for="sort">Sort by</label>
            <select id="sort">
              <option value="new">Newest</option>
              <option value="rating">Top rated</option>
              <option value="name">Name (A-Z)</option>
            </select>
            <i class="fa-solid fa-chevron-down"></i>
          </div>
          <div class="view-toggle" role="group" aria-label="Layout">
            <button type="button" class="view-btn active" id="listViewBtn" title="List view" aria-label="List view">
              <i class="fa-solid fa-list"></i>
            </button>
            <button type="button" class="view-btn" id="gridViewBtn" title="Grid view" aria-label="Grid view">
              <i class="fa-solid fa-table-cells"></i>
            </button>
          </div>
        </div>
      </div>

      <div id="modsList" class="mods-list">
        <div class="loading-state">Loading mods…</div>
      </div>
    </section>
  </div>
</main>

<footer class="site-footer">Litterbox &middot; made for the Cat Goes Fishing community &middot; <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a></footer>

<script>
let allMods = [];
let allProfiles = [];
let currentBrowseTab = "mods";
let currentReleaseTab = "out";
let currentUserId = null;
let currentSort = "new";
let selectedFilterCategoryIds = new Set();
let categoriesAvailable = false;

function iconInitials(name) {
  if (!name) return "?";
  const words = name.trim().split(/\s+/);
  const initials = words.slice(0, 2).map(w => w[0]?.toUpperCase() || "").join("");
  return initials || "?";
}

function timeAgo(dateStr) {
  if (!dateStr) return "";
  const then = new Date(dateStr).getTime();
  const now = Date.now();
  const diffSec = Math.max(1, Math.floor((now - then) / 1000));
  const units = [
    [31536000, "year"], [2592000, "month"], [86400, "day"],
    [3600, "hour"], [60, "minute"], [1, "second"]
  ];
  for (const [secs, label] of units) {
    const val = Math.floor(diffSec / secs);
    if (val >= 1) return `${val} ${label}${val > 1 ? "s" : ""} ago`;
  }
  return "just now";
}

function isTrustedStorageUrl(url) {
  return typeof url === "string" && url.startsWith(TRUSTED_STORAGE_PREFIX);
}

function sortMods(mods) {
  const copy = [...mods];
  if (currentSort === "rating") copy.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  else if (currentSort === "name") copy.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  else copy.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  return copy;
}

// Mods vs Previews is now an exclusive filter (pick one, not both at once) -
// replaces the old additive "show/hide previews" toggle.
function renderMods(mods) {
  const listEl = document.getElementById("modsList");
  const visible = mods.filter(m => Boolean(m.is_preview) === (currentReleaseTab === "previews"));

  if (visible.length === 0) {
    listEl.innerHTML = `<div class="empty-state">${currentReleaseTab === "previews" ? "No preview mods right now." : "No mods found."}</div>`;
    return;
  }

  listEl.innerHTML = sortMods(visible).map(mod => LB_renderModCard(mod, { currentUserId })).join("");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function applyFilters() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  if (currentBrowseTab === "creators") {
    if (!query) { renderCreators(allProfiles); return; }
    renderCreators(allProfiles.filter(p =>
      (p.username || "").toLowerCase().includes(query) ||
      (p.bio || "").toLowerCase().includes(query)
    ));
    return;
  }
  let filtered = query
    ? allMods.filter(mod =>
        (mod.name || "").toLowerCase().includes(query) ||
        (mod.author || "").toLowerCase().includes(query) ||
        (mod.description || "").toLowerCase().includes(query)
      )
    : allMods;
  // Category filter is an "any of" (OR) match - selecting "New Fish" +
  // "QoL Tweaks" shows mods with either tag, not both, since that's what
  // people expect from a browse filter and keeps results from collapsing
  // to empty the moment two tags are picked.
  if (selectedFilterCategoryIds.size > 0) {
    filtered = filtered.filter(mod =>
      (mod.categories || []).some(c => selectedFilterCategoryIds.has(c.id))
    );
  }
  renderMods(filtered);
}

async function loadMods() {
  const listEl = document.getElementById("modsList");

  const { data, error } = await supabaseClient
    .from("mods")
    .select("*, profiles!mods_profiles_fkey(is_verified), mod_categories(categories(id, slug, name, icon))")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Error loading mods:", error);
    listEl.innerHTML = `<div class="error-state">Couldn't load mods. Please try again later.</div>`;
    return;
  }

  allMods = (data || []).map(mod => ({ ...mod, categories: LB_flattenModCategories(mod) }));
  renderMods(allMods);
}

async function initCategoryFilter() {
  const categories = await LB_loadCategories();
  const boxEl = document.getElementById("categoryBox");
  const listEl = document.getElementById("categoryList");
  const clearEl = document.getElementById("categoryClear");
  if (categories.length === 0) { categoriesAvailable = false; return; }
  categoriesAvailable = true;
  boxEl.style.display = "block";

  listEl.innerHTML = categories.map(c => `
    <button type="button" class="category-list-item" data-cat-id="${c.id}">
      <i class="${escapeHtml(c.icon || "fa-solid fa-tag")}"></i>
      <span>${escapeHtml(c.name)}</span>
      <i class="fa-solid fa-check cat-check" aria-hidden="true"></i>
    </button>
  `).join("");

  listEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".category-list-item");
    if (!btn) return;
    const id = Number(btn.dataset.catId);
    btn.classList.toggle("active");
    if (btn.classList.contains("active")) selectedFilterCategoryIds.add(id);
    else selectedFilterCategoryIds.delete(id);
    clearEl.hidden = selectedFilterCategoryIds.size === 0;
    applyFilters();
  });

  clearEl.addEventListener("click", () => {
    listEl.querySelectorAll(".category-list-item.active").forEach(b => b.classList.remove("active"));
    selectedFilterCategoryIds.clear();
    clearEl.hidden = true;
    applyFilters();
  });

  document.getElementById("categoryCollapseBtn").addEventListener("click", () => {
    const collapsed = boxEl.classList.toggle("collapsed");
    document.getElementById("categoryCollapseBtn").setAttribute("aria-expanded", String(!collapsed));
  });
}

function renderCreators(profiles) {
  const listEl = document.getElementById("modsList");

  if (profiles.length === 0) {
    listEl.innerHTML = `<div class="empty-state">No creators found.</div>`;
    return;
  }

  const sorted = [...profiles].sort((a, b) => (b._modCount || 0) - (a._modCount || 0));
  listEl.innerHTML = sorted.map(p => {
    const safeAvatar = isTrustedStorageUrl(p.avatar_url) ? escapeHtml(p.avatar_url) : null;
    return `
      <a class="creator-row" href="profile.html?u=${encodeURIComponent(p.username)}">
        <div class="creator-avatar">${safeAvatar ? `<img src="${safeAvatar}" alt="">` : iconInitials(p.username)}</div>
        <div class="creator-main">
          <p class="creator-name">${escapeHtml(p.username)}${p.is_verified ? VERIFIED_BADGE : ""}</p>
          <p class="creator-bio">${escapeHtml(p.bio || "No bio yet.")}</p>
        </div>
        <div class="creator-stats">
          <span class="stat-chip">${CUBE_ICON}<strong>${p._modCount || 0}</strong></span>
          <span class="stat-chip">${DOWNLOAD_ICON}<strong>${LB_formatCount(p._downloadCount || 0)}</strong></span>
        </div>
      </a>
    `;
  }).join("");
}

async function loadProfiles() {
  if (allProfiles.length > 0) return;
  const { data, error } = await supabaseClient.from("profiles").select("*");
  if (error) {
    console.error("Error loading creators:", error);
    return;
  }
  const statsByUser = {};
  allMods.forEach(m => {
    if (!m.user_id) return;
    if (!statsByUser[m.user_id]) statsByUser[m.user_id] = { mods: 0, downloads: 0 };
    statsByUser[m.user_id].mods += 1;
    statsByUser[m.user_id].downloads += m.download_count || 0;
  });
  allProfiles = (data || [])
    .filter(p => p.username)
    .map(p => ({ ...p, _modCount: statsByUser[p.id]?.mods || 0, _downloadCount: statsByUser[p.id]?.downloads || 0 }));
}

async function switchTab(tab) {
  currentBrowseTab = tab;
  document.getElementById("modsTabBtn").classList.toggle("active", tab === "mods");
  document.getElementById("creatorsTabBtn").classList.toggle("active", tab === "creators");
  document.getElementById("releaseTabs").style.display = tab === "mods" ? "inline-flex" : "none";
  document.getElementById("categoryBox").style.display = (tab === "mods" && categoriesAvailable) ? "block" : "none";
  document.getElementById("browseMainControls").style.display = tab === "mods" ? "flex" : "none";
  document.getElementById("search").placeholder = tab === "mods" ? "Search mods..." : "Search creators...";
  document.getElementById("search").value = "";

  if (tab === "creators") {
    document.getElementById("modsList").innerHTML = `<div class="loading-state">Loading creators…</div>`;
    await loadProfiles();
    renderCreators(allProfiles);
  } else {
    renderMods(allMods);
  }
}
document.getElementById("modsTabBtn").addEventListener("click", () => switchTab("mods"));
document.getElementById("creatorsTabBtn").addEventListener("click", () => switchTab("creators"));

function setReleaseTab(tab) {
  currentReleaseTab = tab;
  document.getElementById("releasedTabBtn").classList.toggle("active", tab === "out");
  document.getElementById("previewTabBtn").classList.toggle("active", tab === "previews");
  applyFilters();
}
document.getElementById("releasedTabBtn").addEventListener("click", () => setReleaseTab("out"));
document.getElementById("previewTabBtn").addEventListener("click", () => setReleaseTab("previews"));

document.getElementById("search").addEventListener("input", applyFilters);
document.getElementById("sort").addEventListener("change", (e) => {
  currentSort = e.target.value;
  applyFilters();
});

function setView(mode) {
  const listEl = document.getElementById("modsList");
  const listBtn = document.getElementById("listViewBtn");
  const gridBtn = document.getElementById("gridViewBtn");
  listEl.classList.toggle("grid", mode === "grid");
  listBtn.classList.toggle("active", mode === "list");
  gridBtn.classList.toggle("active", mode === "grid");
  localStorage.setItem("litterbox-view", mode);
}
document.getElementById("listViewBtn").addEventListener("click", () => setView("list"));
document.getElementById("gridViewBtn").addEventListener("click", () => setView("grid"));
setView(localStorage.getItem("litterbox-view") === "grid" ? "grid" : "list");

// ---------- mobile "Filters" panel ----------
const filtersToggleBtn = document.getElementById("filtersToggleBtn");
const sidebarFilters = document.getElementById("sidebarFilters");
filtersToggleBtn.addEventListener("click", () => {
  const opening = !sidebarFilters.classList.contains("open");
  sidebarFilters.classList.toggle("open", opening);
  filtersToggleBtn.setAttribute("aria-expanded", String(opening));
});
document.addEventListener("click", (e) => {
  if (window.innerWidth > 860) return;
  if (sidebarFilters.classList.contains("open") && !sidebarFilters.contains(e.target) && !filtersToggleBtn.contains(e.target)) {
    sidebarFilters.classList.remove("open");
    filtersToggleBtn.setAttribute("aria-expanded", "false");
  }
});

async function init() {
  const nav = await LB_mountHeaderNav();
  currentUserId = nav.user?.id || null;
  await Promise.all([loadMods(), initCategoryFilter()]);
}

init();
</script>

</body>
