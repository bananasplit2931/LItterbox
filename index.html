<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Litterbox - Mods for Cat Goes Fishing</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="description" content="Browse and share mods for Cat Goes Fishing.">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
<link rel="stylesheet" href="assets/style.css">
<!-- Google AdSense: po założeniu konta wklej tu kod weryfikacyjny / Auto ads script
     (panel AdSense -> Ads -> Overview -> Get code), np.:
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/app.js"></script>
<style>
.mods-section { padding: 30px clamp(16px, 5vw, 56px) 64px; max-width: 1180px; margin: 0 auto; }

.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }

/* ---- expanding search: a lens button that a search bar slides out from ----
   The wrap itself grows, so its neighbors (sort pill, view toggle, count)
   naturally slide over to make room. Driven by a JS-toggled .expanded class
   (mouseenter/leave + click) rather than CSS :hover - hovering an element
   that resizes itself is a classic flicker trap, since the box growing can
   nudge the cursor across its own edge and re-trigger/un-trigger :hover
   mid-transition. JS enter/leave events don't have that feedback loop. */
.search-orb-wrap {
  position: relative; flex-shrink: 0;
  width: 36px; height: 36px;
  transition: width .22s var(--ease-out);
}
.search-orb-wrap.expanded, .search-orb-wrap:focus-within { width: min(280px, 50vw); }

.search-orb-btn {
  position: relative; z-index: 2;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--color-surface); border: 1px solid var(--color-border);
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  color: var(--color-text-muted); cursor: pointer;
  transition: color .15s ease, border-color .15s ease, transform .15s var(--ease-out);
}
.search-orb-wrap.expanded .search-orb-btn,
.search-orb-wrap:focus-within .search-orb-btn { color: var(--color-accent); border-color: var(--color-accent); }
.search-orb-btn:active { transform: scale(.9); }

/* padding-left is reserved up front (not animated — animating padding
   triggers layout) so only opacity/transform move, both GPU-only */
.search-orb-input {
  position: absolute; left: 0; top: 0;
  height: 36px; width: 100%; box-sizing: border-box;
  padding: 0 14px 0 38px; border: 1px solid transparent; outline: none;
  background: var(--color-surface); border-radius: var(--radius-pill);
  color: var(--color-text); font-family: var(--font-body); font-size: 14px;
  opacity: 0; pointer-events: none;
  transform: translateX(-4px);
  transition: opacity .18s var(--ease-out), transform .18s var(--ease-out), border-color .15s ease;
}
.search-orb-wrap.expanded .search-orb-input,
.search-orb-wrap:focus-within .search-orb-input {
  opacity: 1; pointer-events: auto; transform: translateX(0);
  border-color: var(--color-border);
}
.search-orb-wrap:focus-within .search-orb-input { border-color: var(--color-accent); }

.toolbar-row2 { display: flex; align-items: center; gap: 10px; flex: 1; flex-wrap: wrap; }

.pill-select {
  position: relative; display: flex; align-items: center; gap: 6px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-pill); padding: 0 6px 0 14px;
}
.pill-select label { font-size: 13px; color: var(--color-text-muted); white-space: nowrap; margin: 0; font-weight: 500; }
.pill-select select {
  appearance: none; background: none; border: none; color: var(--color-text);
  font-family: var(--font-body); font-weight: 600; font-size: 13px;
  padding: 7px 22px 7px 4px; cursor: pointer;
}
.pill-select select:focus { outline: none; }
.pill-select i {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  font-size: 9px; color: var(--color-text-faint); pointer-events: none;
}

.view-toggle { display: flex; border: 1px solid var(--color-border); border-radius: var(--radius-pill); overflow: hidden; }

/* ---- preview-mods toggle: same pill language as the sort control, same
   active-state treatment as the view-toggle buttons — not a foreign switch ---- */
.pill-toggle {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px;
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-pill);
  color: var(--color-text-muted); font-family: var(--font-body); font-weight: 600; font-size: 13px;
  cursor: pointer; transition: background .12s ease, border-color .12s ease, color .12s ease;
}
.pill-toggle i { font-size: 12px; color: var(--color-text-faint); transition: color .12s ease; }
.pill-toggle:hover { border-color: var(--color-border-strong); color: var(--color-text); }
.pill-toggle.active { background: var(--color-preview-bg); border-color: var(--color-preview-border); color: var(--color-preview); }
.pill-toggle.active i { color: var(--color-preview); }
.view-btn {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; background: var(--color-surface); border: none; cursor: pointer;
  color: var(--color-text-faint); font-size: 14px;
  transition: color .12s ease, background .12s ease;
}
.view-btn:hover { color: var(--color-text); }
.view-btn.active { background: var(--color-accent-tint); color: var(--color-accent); }
.view-btn + .view-btn { border-left: 1px solid var(--color-border); }

#modCount { font-size: 13px; color: var(--color-text-faint); white-space: nowrap; margin-left: auto; }

.category-filter-row {
  margin: -6px 0 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
}
.category-filter-row .category-picker { display: contents; }
.category-filter-row .category-chip-btn { font-size: 12px; padding: 5px 11px; }
.category-filter-clear {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-body); font-weight: 600; font-size: 12px;
  color: var(--color-text-faint); background: none; border: 1px dashed var(--color-border-strong);
  border-radius: var(--radius-pill); padding: 5px 11px; cursor: pointer;
  transition: color .12s ease, border-color .12s ease;
}
.category-filter-clear:hover { color: var(--color-text); border-color: var(--color-text-faint); }

/* ---- list view (default) ---- */
.mods-list { display: flex; flex-direction: column; gap: 10px; }

@media (max-width: 600px) {
  .mods-section { padding: 20px 16px 48px; }
}
@media (max-width: 480px) {
  .toolbar-row2 { flex-wrap: wrap; }
  #modCount { order: 3; margin-left: 0; width: 100%; }
}
</style>
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">
    <img src="assets/logo.png" alt="" class="brand-mark">
    <span class="brand-name">Litterbox</span>
  </a>
  <div class="header-right">
    <span id="notifSlot"></span>
    <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
    <div class="nav-drawer" id="navDrawer"></div>
  </div>
</header>

<main>
  <section class="mods-section">
    <div class="browse-tabs" role="tablist" style="margin-bottom: 14px;">
      <button type="button" class="browse-tab active" id="modsTabBtn" role="tab"><i class="fa-solid fa-cube"></i> Mods</button>
      <button type="button" class="browse-tab" id="creatorsTabBtn" role="tab"><i class="fa-solid fa-user-group"></i> Creators</button>
    </div>

    <div class="toolbar">
      <div class="search-orb-wrap" id="searchOrbWrap">
        <button type="button" class="search-orb-btn" id="searchOrbBtn" aria-label="Search" aria-expanded="false">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <input id="search" class="search-orb-input" type="text" placeholder="Search mods..." aria-label="Search mods">
      </div>

      <div class="toolbar-row2" id="toolbarRow2">
        <div class="pill-select">
          <label for="sort">Sort by</label>
          <select id="sort">
            <option value="new">Newest</option>
            <option value="rating">Top rated</option>
            <option value="name">Name (A-Z)</option>
          </select>
          <i class="fa-solid fa-chevron-down"></i>
        </div>

        <div class="view-toggle" role="group" aria-label="Layout">
          <button type="button" class="view-btn active" id="listViewBtn" title="List view" aria-label="List view">
            <i class="fa-solid fa-list"></i>
          </button>
          <button type="button" class="view-btn" id="gridViewBtn" title="Grid view" aria-label="Grid view">
            <i class="fa-solid fa-table-cells"></i>
          </button>
        </div>

        <button type="button" class="pill-toggle active" id="showPreviewToggle" aria-pressed="true" title="Show or hide preview mods">
          <i class="fa-solid fa-flask"></i> Previews
        </button>

        <span id="modCount">Loading…</span>
      </div>
    </div>

    <div class="category-filter-row" id="categoryFilterRow" style="display:none;"></div>

    <div class="ad-slot" style="margin-bottom:16px;">
      <!-- TODO: wklej tu kod jednostki reklamowej z panelu AdSense (Ads > Ad units) -->
      Miejsce na reklamę
    </div>

    <div id="modsList" class="mods-list">
      <div class="loading-state">Loading mods…</div>
    </div>
  </section>
</main>

<footer class="site-footer">Litterbox &middot; made for the Cat Goes Fishing community &middot; <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a></footer>

<script>
let allMods = [];
let allProfiles = [];
let currentBrowseTab = "mods";
let currentUserId = null;
let currentSort = "new";
let showPreview = localStorage.getItem("litterbox-show-preview") !== "0";
let selectedFilterCategoryIds = new Set();

function iconInitials(name) {
  if (!name) return "?";
  const words = name.trim().split(/\s+/);
  const initials = words.slice(0, 2).map(w => w[0]?.toUpperCase() || "").join("");
  return initials || "?";
}

function timeAgo(dateStr) {
  if (!dateStr) return "";
  const then = new Date(dateStr).getTime();
  const now = Date.now();
  const diffSec = Math.max(1, Math.floor((now - then) / 1000));
  const units = [
    [31536000, "year"], [2592000, "month"], [86400, "day"],
    [3600, "hour"], [60, "minute"], [1, "second"]
  ];
  for (const [secs, label] of units) {
    const val = Math.floor(diffSec / secs);
    if (val >= 1) return `${val} ${label}${val > 1 ? "s" : ""} ago`;
  }
  return "just now";
}

function isTrustedStorageUrl(url) {
  return typeof url === "string" && url.startsWith(TRUSTED_STORAGE_PREFIX);
}

function sortMods(mods) {
  const copy = [...mods];
  if (currentSort === "rating") copy.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  else if (currentSort === "name") copy.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  else copy.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  return copy;
}

function renderMods(mods) {
  const listEl = document.getElementById("modsList");
  const countEl = document.getElementById("modCount");
  const visible = showPreview ? mods : mods.filter(m => !m.is_preview);

  if (visible.length === 0) {
    listEl.innerHTML = `<div class="empty-state">${mods.length ? "No mods match with previews hidden." : "No mods found."}</div>`;
    countEl.textContent = "0 mods";
    return;
  }

  countEl.textContent = `${visible.length} mod${visible.length === 1 ? "" : "s"}`;

  listEl.innerHTML = sortMods(visible).map(mod => LB_renderModCard(mod, { currentUserId })).join("");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function applyFilters() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  if (currentBrowseTab === "creators") {
    if (!query) { renderCreators(allProfiles); return; }
    renderCreators(allProfiles.filter(p =>
      (p.username || "").toLowerCase().includes(query) ||
      (p.bio || "").toLowerCase().includes(query)
    ));
    return;
  }
  let filtered = query
    ? allMods.filter(mod =>
        (mod.name || "").toLowerCase().includes(query) ||
        (mod.author || "").toLowerCase().includes(query) ||
        (mod.description || "").toLowerCase().includes(query)
      )
    : allMods;
  // Category filter is an "any of" (OR) match - selecting "New Fish" +
  // "QoL Tweaks" shows mods with either tag, not both, since that's what
  // people expect from a browse filter and keeps results from collapsing
  // to empty the moment two tags are picked.
  if (selectedFilterCategoryIds.size > 0) {
    filtered = filtered.filter(mod =>
      (mod.categories || []).some(c => selectedFilterCategoryIds.has(c.id))
    );
  }
  renderMods(filtered);
}

async function loadMods() {
  const listEl = document.getElementById("modsList");
  const countEl = document.getElementById("modCount");

  const { data, error } = await supabaseClient
    .from("mods")
    .select("*, profiles!mods_profiles_fkey(is_verified), mod_categories(categories(id, slug, name, icon))")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Error loading mods:", error);
    listEl.innerHTML = `<div class="error-state">Couldn't load mods. Please try again later.</div>`;
    countEl.textContent = "";
    return;
  }

  allMods = (data || []).map(mod => ({ ...mod, categories: LB_flattenModCategories(mod) }));
  renderMods(allMods);
}

async function initCategoryFilter() {
  const categories = await LB_loadCategories();
  const rowEl = document.getElementById("categoryFilterRow");
  if (categories.length === 0) return;
  rowEl.style.display = "block";
  rowEl.innerHTML = `${LB_renderCategoryPicker(categories, [])}<button type="button" class="category-filter-clear" id="categoryFilterClear" hidden><i class="fa-solid fa-xmark"></i>Clear filters</button>`;
  const pickerEl = rowEl.querySelector(".category-picker");
  const clearBtn = document.getElementById("categoryFilterClear");
  selectedFilterCategoryIds = LB_wireCategoryPicker(pickerEl, (selected) => {
    clearBtn.hidden = selected.size === 0;
    applyFilters();
  });
  clearBtn.addEventListener("click", () => {
    pickerEl.querySelectorAll(".category-chip-btn.active").forEach(b => b.classList.remove("active"));
    selectedFilterCategoryIds.clear();
    clearBtn.hidden = true;
    applyFilters();
  });
}

function renderCreators(profiles) {
  const listEl = document.getElementById("modsList");
  const countEl = document.getElementById("modCount");

  if (profiles.length === 0) {
    listEl.innerHTML = `<div class="empty-state">No creators found.</div>`;
    countEl.textContent = "0 creators";
    return;
  }

  countEl.textContent = `${profiles.length} creator${profiles.length === 1 ? "" : "s"}`;

  const sorted = [...profiles].sort((a, b) => (b._modCount || 0) - (a._modCount || 0));
  listEl.innerHTML = sorted.map(p => {
    const safeAvatar = isTrustedStorageUrl(p.avatar_url) ? escapeHtml(p.avatar_url) : null;
    return `
      <a class="creator-row" href="profile.html?u=${encodeURIComponent(p.username)}">
        <div class="creator-avatar">${safeAvatar ? `<img src="${safeAvatar}" alt="">` : iconInitials(p.username)}</div>
        <div class="creator-main">
          <p class="creator-name">${escapeHtml(p.username)}${p.is_verified ? VERIFIED_BADGE : ""}</p>
          <p class="creator-bio">${escapeHtml(p.bio || "No bio yet.")}</p>
        </div>
        <div class="creator-stats">
          <span class="stat-chip">${CUBE_ICON}<strong>${p._modCount || 0}</strong></span>
          <span class="stat-chip">${DOWNLOAD_ICON}<strong>${LB_formatCount(p._downloadCount || 0)}</strong></span>
        </div>
      </a>
    `;
  }).join("");
}

async function loadProfiles() {
  if (allProfiles.length > 0) return;
  const { data, error } = await supabaseClient.from("profiles").select("*");
  if (error) {
    console.error("Error loading creators:", error);
    return;
  }
  const statsByUser = {};
  allMods.forEach(m => {
    if (!m.user_id) return;
    if (!statsByUser[m.user_id]) statsByUser[m.user_id] = { mods: 0, downloads: 0 };
    statsByUser[m.user_id].mods += 1;
    statsByUser[m.user_id].downloads += m.download_count || 0;
  });
  allProfiles = (data || [])
    .filter(p => p.username)
    .map(p => ({ ...p, _modCount: statsByUser[p.id]?.mods || 0, _downloadCount: statsByUser[p.id]?.downloads || 0 }));
}

async function switchTab(tab) {
  currentBrowseTab = tab;
  document.getElementById("modsTabBtn").classList.toggle("active", tab === "mods");
  document.getElementById("creatorsTabBtn").classList.toggle("active", tab === "creators");
  document.getElementById("toolbarRow2").style.display = tab === "mods" ? "flex" : "none";
  document.getElementById("search").placeholder = tab === "mods" ? "Search mods..." : "Search creators...";
  document.getElementById("search").value = "";

  const filterRow = document.getElementById("categoryFilterRow");
  if (filterRow.innerHTML.trim()) filterRow.style.display = tab === "mods" ? "block" : "none";

  if (tab === "creators") {
    document.getElementById("modsList").innerHTML = `<div class="loading-state">Loading creators…</div>`;
    await loadProfiles();
    renderCreators(allProfiles);
  } else {
    renderMods(allMods);
  }
}
document.getElementById("modsTabBtn").addEventListener("click", () => switchTab("mods"));
document.getElementById("creatorsTabBtn").addEventListener("click", () => switchTab("creators"));

document.getElementById("search").addEventListener("input", applyFilters);
document.getElementById("sort").addEventListener("change", (e) => {
  currentSort = e.target.value;
  applyFilters();
});

function setView(mode) {
  const listEl = document.getElementById("modsList");
  const listBtn = document.getElementById("listViewBtn");
  const gridBtn = document.getElementById("gridViewBtn");
  listEl.classList.toggle("grid", mode === "grid");
  listBtn.classList.toggle("active", mode === "list");
  gridBtn.classList.toggle("active", mode === "grid");
  localStorage.setItem("litterbox-view", mode);
}
document.getElementById("listViewBtn").addEventListener("click", () => setView("list"));
document.getElementById("gridViewBtn").addEventListener("click", () => setView("grid"));
setView(localStorage.getItem("litterbox-view") === "grid" ? "grid" : "list");

const showPreviewToggle = document.getElementById("showPreviewToggle");
showPreviewToggle.classList.toggle("active", showPreview);
showPreviewToggle.setAttribute("aria-pressed", String(showPreview));
showPreviewToggle.addEventListener("click", () => {
  showPreview = !showPreview;
  showPreviewToggle.classList.toggle("active", showPreview);
  showPreviewToggle.setAttribute("aria-pressed", String(showPreview));
  localStorage.setItem("litterbox-show-preview", showPreview ? "1" : "0");
  applyFilters();
});

// ---------- expanding search: click/tap the lens to slide the bar out ----------
const searchOrbWrap = document.getElementById("searchOrbWrap");
const searchOrbBtn = document.getElementById("searchOrbBtn");
const searchInput = document.getElementById("search");

function setSearchExpanded(expanded) {
  searchOrbWrap.classList.toggle("expanded", expanded);
  searchOrbBtn.setAttribute("aria-expanded", String(expanded));
}
searchOrbBtn.addEventListener("click", () => {
  const expanding = !searchOrbWrap.classList.contains("expanded");
  setSearchExpanded(expanding);
  if (expanding) searchInput.focus();
});
if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
  searchOrbWrap.addEventListener("mouseenter", () => setSearchExpanded(true));
  searchOrbWrap.addEventListener("mouseleave", () => {
    if (!searchInput.value && document.activeElement !== searchInput) setSearchExpanded(false);
  });
}
searchInput.addEventListener("focus", () => setSearchExpanded(true));
document.addEventListener("click", (e) => {
  if (searchOrbWrap.classList.contains("expanded") && !searchOrbWrap.contains(e.target) && !searchInput.value) {
    setSearchExpanded(false);
  }
});

async function init() {
  const nav = await LB_mountHeaderNav();
  currentUserId = nav.user?.id || null;
  await Promise.all([loadMods(), initCategoryFilter()]);
}

init();
</script>

</body>
</html>
